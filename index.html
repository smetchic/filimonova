<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Филимонова</title>
<link rel="stylesheet" href="./assets/app.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="./assets/config.js"></script>
<script defer src="./assets/app.js"></script>
</head>
<body>
<section id="authView" class="shell">
  <div class="panel">
    <div class="panel-head">
      <div class="brand">Филимонова</div>
      <div class="subtitle">Рабочая система ПТО</div>
    </div>
    <div class="panel-body">
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Вход</button>
        <button id="tabSignup" class="tab" type="button">Первая регистрация</button>
      </div>

      <form id="loginForm" class="form">
        <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
        <div class="field"><label for="loginPassword">Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <button class="primary" type="submit">Войти</button>
        <div id="loginStatus" class="status"></div>
      </form>

      <form id="signupForm" class="form hidden">
        <div class="field"><label for="signupEmail">Email администратора</label><input id="signupEmail" type="email" autocomplete="username" required></div>
        <div class="field"><label for="signupPassword">Пароль</label><input id="signupPassword" type="password" autocomplete="new-password" required></div>
        <div class="field"><label for="signupPassword2">Повторите пароль</label><input id="signupPassword2" type="password" autocomplete="new-password" required></div>
        <button class="primary" type="submit">Создать учётную запись</button>
        <div id="signupStatus" class="status"></div>
        <div class="note">Глобальные права назначаются только заранее разрешённому адресу администратора. Остальные учётные записи не получают доступ к данным проекта.</div>
      </form>
    </div>
  </div>
</section>

<section id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand">Филимонова</div>
    <div class="top-actions"><span id="userEmail">—</span><button id="logoutBtn" class="text-action" type="button">Выйти</button></div>
  </header>
  <main class="workspace">
    <section class="card">
      <h2>Подключение к Supabase</h2>
      <div class="grid">
        <div class="k">Права</div><div class="v"><span id="adminState" class="badge">Проверка…</span></div>
        <div class="k">Проект</div><div id="projectName" class="v">—</div>
        <div class="k">Статус</div><div id="projectStatus" class="v">—</div>
        <div class="k">Project ID</div><div id="projectId" class="v">—</div>
      </div>
    </section>
  </main>
</section>
</body>
</html>
